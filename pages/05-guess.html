<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess What I'm Thinking 👀</title>

    <!-- Shared typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- Shared styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <!-- Floating decorative hearts -->
    <div id="effects-layer" aria-hidden="true"></div>

    <main class="page fade-in">
        
        <div class="page-content narrow">
            <div class="center">
                <p class="eyebrow">Tiny challenge</p>

                <h2>Guess what I'm thinking 👀</h2>
            </div>

            <div class="guess-card">
                <p class="guess-question">
                    I'm thinking about someone right now...
                    <br>
                    who do you think it is?
                </p>

                <div class="button-row">
                    <button
                        class="button button-soft guess-button"
                        data-answer="you"
                        type="button"
                    >
                        You 👀
                    </button>

                    <button
                        class="button button-soft guess-button"
                        data-answer="someone"
                        type="button"
                    >
                        Someone else 😭
                    </button>

                    <button
                        class="button button-soft guess-button"
                        data-answer="pizza"
                        type="button"
                    >
                        Pizza 🍕
                    </button>
                </div>

                <p
                    class="guess-result"
                    id="guess-result"
                    aria-live="polite"
                ></p>
            </div>
        </div>
    

        <!-- Every page has Back / page number / Next controls. -->
        <nav class="page-nav" aria-label="Page navigation">
            <a class="button button-soft" data-page-link href="04-quiz.html">← Back</a>

            <span class="page-nav-center">
                05 / 09
            </span>

            <a class="button button-primary" data-page-link href="06-song.html">Next →</a>
        </nav>
    </main>

    <!-- Shared JavaScript -->
    <script src="../data/content.js"></script>
    <script src="../js/main.js"></script>

    <script>
        /* Guessing game responses are kept local to this page. */
        const guessResponses = {
            you: "How did you know?! 😳❤️",
            someone: "Ouch. 😭 Luckily, you guessed wrong. 👀",
            pizza: "Honestly... I respect the answer. 😂🍕 But this time it's you."
        };

        const guessResult =
            document.getElementById("guess-result");

        document
            .querySelectorAll(".guess-button")
            .forEach((button) => {
                button.addEventListener("click", () => {
                    guessResult.textContent =
                        guessResponses[
                            button.dataset.answer
                        ];
                });
            });
    </script>
</body>
</html>
