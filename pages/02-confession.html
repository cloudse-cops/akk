            <h2>
                There is something
                <span class="script">I should tell you...</span>
            </h2>

            <div class="confession-list">
                <p class="confession-line">
                    You're really <strong>beautiful.</strong> 🌸
                </p>

                <p class="confession-line">
                    And you're <strong>so cute.</strong> 🥹
                </p>

                <p class="confession-line">
                    Like... the kind of cute that makes someone
                    look twice without even realizing it. 👀
                </p>

                <p class="confession-line">
                    Honestly, you're becoming
                    <strong>my favorite distraction.</strong> 😏❤️
                </p>
